[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unwrap"
dynamic = ["version"]
description = "Peel obfuscation off malicious PowerShell, JavaScript, VBScript and batch scripts statically, layer by layer, without ever running them. Verified against the real interpreters. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["deobfuscation", "malware-analysis", "powershell", "javascript", "vbscript", "dfir", "incident-response", "blue-team", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/unwrap"

[project.scripts]
unwrap = "unwrap.cli:main"

[tool.setuptools.dynamic]
version = { attr = "unwrap.__version__" }

[tool.setuptools.packages.find]
include = ["unwrap*"]
